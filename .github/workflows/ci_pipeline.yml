name: Python CI Pipeline - Sistem Perpustakaan

# Pipeline akan berjalan otomatis saat ada push atau pull request ke branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Kode dari Repositori (Checkout)
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Lingkungan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Menginstal Dependensi Proyek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Mengabaikan warning panjang baris (E501) atau mengecualikan folder tertentu
          flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
          # Atau jika ingin memeriksa kode utama dengan toleransi tertentu:
          flake8 controller/ views/ model/ --max-line-length=120 --ignore=E501,W293

      - name: 5. Menjalankan Automated Unit Testing (Pytest)
        run: |
          python -m pytest -v